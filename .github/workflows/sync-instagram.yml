name: Sync Instagram feed

# Pulls the latest posts into data/posts.json and commits the change.
# Runs twice a day, and on demand from the Actions tab.
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch the feed
        id: sync
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          # decrypts and encrypts data/token.json - see scripts/token-store.js
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: node scripts/sync-instagram.js

      - name: Commit the new feed
        run: |
          git config user.name  "Instagram sync"
          git config user.email "actions@github.com"
          git add data/posts.json data/unsorted.json assets/img/hero.jpg
          if [ -f data/token.json ]; then git add data/token.json; fi
          if git diff --staged --quiet; then
            echo "no change in the feed"
          else
            git commit -m "Sync Instagram feed"
            git push
          fi
